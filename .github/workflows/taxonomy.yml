name: Taxonomy

# Weekly check for changes to https://arxiv.org/category_taxonomy.
# Runs `rake categories:update` and opens a pull request when the bundled
# categories.yaml has drifted from arxiv's published taxonomy.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Refresh taxonomy
        run: bundle exec rake categories:update
      - name: Discard the diff when only the generation date changed
        run: |
          if git diff -I'Generated by' --quiet; then
            git checkout -- lib/arxiv/downloader/categories.yaml
          fi
      - name: Open a pull request if the taxonomy changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: taxonomy-refresh
          commit-message: Refresh category taxonomy from arxiv.org/category_taxonomy
          title: Refresh category taxonomy
          body: |
            The weekly taxonomy check found changes on
            https://arxiv.org/category_taxonomy that are not yet reflected in
            `lib/arxiv/downloader/categories.yaml`.

            Regenerated by `rake categories:update` via the `taxonomy` workflow.
